<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Stats preview card component</title>
  <link rel="stylesheet" href="style.css">
</head>


<body class="body">
  <main class="main flex-contenier">
    <div class="div div-1 content flex-item">
      <div class="box box-1">
        <p class="p-1 big-size white">Get <span class=purple>insights</span> that help your business grow.</p>
      </div>
      <div class="box box-2">
        <p class="paragraph p-2 white-main-paragraph"> Discover the benefits of data analytics and make better decisions regarding revenue, customer 
        experience, and overall efficiency.</p>
      </div>
      <div class="box box-3">
        <p class="inline-block white"><span class="mid-size block"> 10k+</span><span class="block white-main-paragraph paragraph">companies </span></p>
        <p class="inline-block white"><span class="mid-size block">314</span> <span class="block white-main-paragraph paragraph">templates</span></p>
        <p class="inline-block white"><span class="mid-size block">12m+</span> <span class="block white-main-paragraph paragraph">queries</span></p>
      </div>
    </div>
    <div class="div div-2 image flex-item">
    <div class="purple-box"></div>

    <picture>
        <source
            media="(max-width: 768px)"
            srcset="images/image-header-mobile.jpg">

        <img
            src="images/image-header-desktop.jpg"
            alt="image-header-desktop"
            class="img-1">
    </picture>
</div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
